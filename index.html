<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Portfolio weboldal">
</head>
<body>
    <div id="page-index" class="spa-page">
        <main class="card-container">
            <a href="#plc" class="card">
                <div class="card-image">
                    <img src="images/plc_image.jpg" alt="PLC">
                    <div class="card-overlay"></div>
                </div>
                <div class="card-content">
                    <h2 class="card-title">PLC</h2>
                    <div class="card-hover-content">
                        <p>Egy jól strukturált ipari folyamat felépítése, megismerkedés a PLC-vel és annak programozásával, a TIA portal programozó felülettel.</p>
                        <span class="btn-open">Megnyitás</span>
                    </div>
                </div>
            </a>
            <a href="#robotika" class="card">
                <div class="card-image">
                    <img src="images/robotika_image.jpg" alt="Robotika">
                    <div class="card-overlay"></div>
                </div>
                <div class="card-content">
                    <h2 class="card-title">Robotika</h2>
                    <div class="card-hover-content">
                        <p>Ipari robotkarok működése, programozása és integrálása gyártósori környezetbe, automatizált feladatok ellátására.</p>
                        <span class="btn-open">Megnyitás</span>
                    </div>
                </div>
            </a>
        </main>
    </div>

    <div id="page-plc" class="spa-page" style="display: none;">
        <a href="#index" class="icon-back-btn" title="Vissza a főoldalra">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <main class="content-split">
            <section class="pdf-container">
                <iframe src="pdfs/projektfeladat-plc.pdf#navpanes=0&view=Fit" title="PLC Projektfeladat PDF"></iframe>
            </section>
            <section class="video-container">
                <video width="100%" height="100%" controls controlsList="nodownload noplaybackrate" disablePictureInPicture>
                    <source src="videos/projektfeladat-plc.mp4" type="video/mp4">
                    A böngésződ nem támogatja a videó lejátszást.
                </video>
            </section>
        </main>
    </div>

    <div id="page-robotika" class="spa-page" style="display: none;">
        <a href="#index" class="icon-back-btn" title="Vissza a főoldalra">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <main class="content-split">
            <section class="pdf-container">
                <iframe src="pdfs/projektfeladat-robotika.pdf#navpanes=0&view=Fit" title="Robotika Projektfeladat PDF"></iframe>
            </section>
            <section class="video-container">
                <video width="100%" height="100%" controls controlsList="nodownload noplaybackrate" disablePictureInPicture>
                    <source src="videos/projektfeladat-robotika.mp4" type="video/mp4">
                    A böngésződ nem támogatja a videó lejátszást.
                </video>
            </section>
        </main>
    </div>

    <div id="custom-cursor">Megnyitás</div>

    <script src="transition.js"></script>
</body>
</html>
